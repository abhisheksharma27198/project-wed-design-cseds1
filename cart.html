<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartMart | Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            margin: 0;
            padding: 0;
        }

        /* Header */
        header {
            background-color: #2e86de;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        /* Cart Container */
        .cart-container {
            width: 80%;
            margin: 30px auto;
            background-color:white;
            padding: 20px;
            border-radius: 8px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th {
            background-color: #f1f1f1;
            padding: 12px;
            text-align: left;
        }

        table td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .product-name {
            font-weight: bold;
        }

        .price {
            color: #27ae60;
            font-weight: bold;
        }

        /* Quantity box */
        .quantity {
            width: 50px;
            padding: 5px;
            text-align: center;
        }

        /* Total Section */
        .total-section {
            text-align: right;
            margin-top: 20px;
            font-size: 18px;
        }

        .total-section span {
            font-weight: bold;
            color: #2e86de;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #2e86de;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #1b4f72;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 15px;
            background-color: #222;
            color: white;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<header>
    🛒 SmartMart - Your Cart
</header>

<a href="buynow.html">←</a>

<div class="cart-container">
    <h2>Shopping Cart</h2>

    <table>
        <tr>
            <th>Product</th>
            <th>Category</th>
            <th>Price</th>
            <th>Quantity</th>
        </tr>

        <tr>
            <td class="product-name">Basmati Rice</td>
            <td>Groceries</td>
            <td class="price">₹450</td>
            <td><input type="number" class="quantity" value="1"></td>
        </tr>

        <tr>
            <td class="product-name">Amul Cheese</td>
            <td>Groceries</td>
            <td class="price">₹799</td>
            <td><input type="number" class="quantity" value="2"></td>
        </tr>

        <tr>
            <td class="product-name">Ice-cream</td>
            <td>Groceries</td>
            <td class="price">₹1,499</td>
            <td><input type="number" class="quantity" value="1"></td>
        </tr>
    </table>

    <div class="total-section">
        Total Amount: <span>₹3,547</span>
    </div>

    <a href="#" class="btn">Proceed to Checkout</a>
</div>


</body>
</html>
