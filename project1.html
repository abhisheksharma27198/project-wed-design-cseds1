<!DOCTYPE html>
<html lang="en">
<head>

    <!-- INTERNAL CSS -->
    <style>
        /* External-style CSS using classes */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        header {
            background-color: #1abc9c;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #16a085;

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            padding: 20px;
            background-color: lightblue;
            border-radius: 8px;
        }

        .products {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background-color: white;
            width: 250px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            text-align: center;
            padding: 15px;
        }

        .card img {
            width: 100%;
            border-radius: 10px;
        }

        .price {
            color: black;
            font-size: 18px;
            font-weight: bold;
        }

        footer {
            background-color: #1abc9c;
            color: white;
            text-align: center;
            padding: 12px;
            margin-top: 20px;
        }
        button{

            padding:10px;

</head>
