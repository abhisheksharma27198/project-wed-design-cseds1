        /* External-style CSS using classes */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        header {
            background-color: #1abc9c;

            padding: 20px;
            text-align: center;

        nav {
            background-color: #16a085;

        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }

        nav a:hover {

        }

        .container {
            padding: 20px;
        }

        .products {

            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background-color: white;
            width: 250px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);

            padding: 15px;
        }

        .card img {

        }

        .price {

        footer {

            padding:10px;
