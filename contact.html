<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartMart | Contact Us</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            margin: 0;
            padding: 0;
        }

        /* Header */
        header {
            background-color: #2e86de;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        /* Contact Container */
        .contact-container {
            width: 60%;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        /* Form */
        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin: 10px 0 5px;
            font-weight: bold;
            color: #555;
        }

        input, textarea, select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        textarea {
            resize: none;
            height: 120px;
        }

        /* Button */
        .btn {
            margin-top: 20px;
            padding: 12px;
            background-color: #2e86de;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #1b4f72;
        }

        /* Info Section */
        .info {
            margin-top: 25px;
            text-align: center;
            color: #555;
            font-size: 14px;
        }

        
    </style>
</head>

<body>

<header>
     SmartMart - Contact Us
</header>

<div class="contact-container">
    <h2>Have Any Query?</h2>

    <form>
        <label>Full Name</label>
        <input type="text" placeholder="Enter your name" required>

        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Query Type</label>
        <select>
            <option>Order Related</option>
            <option>Payment Issue</option>
            <option>Delivery Problem</option>
            <option>Product Inquiry</option>
            <option>Other</option>
        </select>

        <label>Your Message</label>
        <textarea placeholder="Write your query here..."></textarea>

        <button class="btn">Submit Query</button>
    </form>

    

</body>
</html>
